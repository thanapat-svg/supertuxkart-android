name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NDK_VER: 23.1.7779620
      VERSION_NAME: 1.4-android.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq autoconf automake make python3 python3-packaging python3-mako flex bison \
            imagemagick cmake ninja-build ccache pkg-config subversion vorbis-tools pngquant advancecomp libjpeg-turbo-progs optipng > /dev/null
          # mesa needs a newer meson than Ubuntu ships
          pip3 install --user --break-system-packages -q "meson>=1.4" mako packaging pyyaml
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER" "build-tools;31.0.0" "platforms;android-31" > /dev/null

      - name: Fetch dependencies and assets
        run: |
          curl -fsSL -o deps.tar.xz https://github.com/supertuxkart/dependencies/releases/download/1.4/dependencies-android-src.tar.xz
          tar -xf deps.tar.xz -C lib
          ls lib
          # the 1.4 release source package contains the matching game assets (karts, tracks, music)
          curl -fsSL -o stk-src.tar.xz https://github.com/supertuxkart/stk-code/releases/download/1.4/SuperTuxKart-1.4-src.tar.xz
          mkdir -p /tmp/stksrc && tar -xf stk-src.tar.xz -C /tmp/stksrc --wildcards '*/data/*'
          rm stk-src.tar.xz
          mv /tmp/stksrc/*/data ../stk-assets
          du -sh ../stk-assets; ls ../stk-assets

      - name: Restore built dependencies
        id: depscache
        uses: actions/cache/restore@v4
        with:
          path: android/deps-arm64-v8a
          key: stk14-deps-arm64-${{ env.NDK_VER }}-${{ hashFiles('android/make_deps.sh') }}

      - name: Prepare assets and build dependencies
        working-directory: android
        env:
          COMPILE_ARCH: aarch64
        run: |
          ln -sfn "$ANDROID_HOME" android-sdk
          ln -sfn "$ANDROID_HOME/ndk" android-ndk
          ./generate_assets.sh > /tmp/assets.log 2>&1 || { tail -50 /tmp/assets.log; exit 1; }
          tail -5 /tmp/assets.log
          ./make_deps.sh -j$(nproc) 2>&1 | tee /tmp/deps.log
          if grep -q "Error ocurred" /tmp/deps.log; then echo "dependency build failed"; exit 1; fi

      - name: Save built dependencies
        if: steps.depscache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/deps-arm64-v8a
          key: stk14-deps-arm64-${{ env.NDK_VER }}-${{ hashFiles('android/make_deps.sh') }}

      - name: Build APK
        working-directory: android
        env:
          COMPILE_ARCH: aarch64
          BUILD_TYPE: beta
          PROJECT_VERSION: "1.4"
          BUILD_TOOLS_VER: 31.0.0
          PROJECT_CODE: ${{ github.run_number }}
          STK_KEYSTORE: ${{ github.workspace }}/android/stk-release.keystore
          STK_STOREPASS: assaultcube
          STK_ALIAS: assaultcube
        run: |
          ./make.sh -j$(nproc) 2>&1 | tee /tmp/make.log
          if grep -qE "Error ocurred|^Error:|BUILD FAILED" /tmp/make.log; then echo "build failed"; exit 1; fi
          find . -name "*.apk" -path "*outputs*" | xargs ls -lh

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find android -name "*.apk" -path "*outputs*" | grep -i release | head -1)
          cp "$APK" "out/SuperTuxKart-${VERSION_NAME}.apk"
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "out/SuperTuxKart-${VERSION_NAME}.apk" | head -3
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: SuperTuxKart-Android
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: SuperTuxKart ${{ env.VERSION_NAME }}
          body: |
            APK build from commit ${{ github.sha }} (arm64).
            Download the .apk below and install it on your phone.
          files: out/*.apk
